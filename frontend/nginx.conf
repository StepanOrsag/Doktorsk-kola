server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /posts {
        proxy_pass http://backend:8080;
    }

    location /categories {
        proxy_pass http://backend:8080;
    }
    location /users {
        proxy_pass http://backend:8080;
    }
}